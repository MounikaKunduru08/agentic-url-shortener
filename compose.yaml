services:
  app:
    build:
      context: .
    image: agentic-url-shortener:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/agentic-url-shortener;AUTO_SERVER=TRUE
    ports:
      - "8080:8080"
    volumes:
      - h2-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

volumes:
  h2-data:
