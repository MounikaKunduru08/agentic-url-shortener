spring:
  datasource:
    url: "jdbc:h2:file:./data/agentic-url-shortener;AUTO_SERVER=TRUE"
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
server:
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
agent:
  execution:
    mode: deterministic
